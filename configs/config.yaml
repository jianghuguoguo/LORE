# LORE User Required Configuration
# =============================================================
# 目的：集中放置用户部署时必须填写/确认的参数。
#
# 文件角色：
# 1) 本文件（config.yaml）只放“用户必填项”：
#    - LLM API 接入参数
#    - RAGflow API 接入参数
#    - RAGflow 知识库 ID 路由
# 2) 设计级参数（如 tool_categories、解析规则、调度默认值）
#    统一维护在 configs/design.yaml。
#
# 安全建议：
# - 优先使用环境变量注入密钥（api_key_env），避免明文写入仓库。
# - 不要将真实密钥提交到版本控制。

# ─────────────────────────────────────────────────────────────
# 1. LLM 接入（必填）
# ─────────────────────────────────────────────────────────────
llm:
  # 提供商标识（仅用于标签与日志）
  provider: "generic"

  # 模型与 OpenAI 兼容 API 地址
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"

  # 密钥解析优先级：环境变量 > api_key_literal
  # 密钥格式说明：
  # - 优先使用环境变量，设置为环境变量名（例如: LLM_API_KEY）。
  # - 若使用 `api_key_literal`，填写实际密钥（仅用于本地测试，切勿提交仓库）。
  # - 常见示例：OpenAI 风格为 `sk-...`，其它供应商为任意 token 字符串。
  api_key_env: "LLM_API_KEY"
  api_key_literal: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # 推理参数
  temperature: 0.0
  max_tokens: 2048
  max_retries: 3
  retry_delay: 2.0
  timeout: 60

# ─────────────────────────────────────────────────────────────
# 2. RAGflow 接入与知识库路由（必填）
# ─────────────────────────────────────────────────────────────
ragflow:
  # 主机地址（支持 http://host 或 http://host/api/v1）
  base_url: "http://8.140.33.83"
  base_url_env: "RAGFLOW_BASE_URL"

  # 密钥解析优先级：环境变量 > api_key_literal
  # 密钥格式说明：
  # - 优先使用环境变量，设置为环境变量名（例如: RAGFLOW_API_KEY）。
  # - 若使用 `api_key_literal`，填写实际密钥（仅用于临时测试，切勿提交仓库）。
  # - 示例：`ragflow-<token>` 或控制台生成的任意 token 字符串。
  api_key_env: "RAGFLOW_API_KEY"
  api_key_literal: "xxx"

  # 网络参数
  request_timeout: 60
  retry_times: 2

  # 知识库 ID 路由（请按你的 RAGflow 实例填写）
  # 数据集 ID 格式说明：
  # - 通常为控制台显示的 dataset ID 或 UUID/32 字符十六进制字符串。
  # - 示例：b5f3a66f065f11f1bca40242ac120006（仅示例，替换为你的实例 ID）。
  datasets:
    # Layer4 / 回流主库
    experience: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    # Layer3 分层上传路由
    factual: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    procedural_pos: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    procedural_neg: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    metacognitive: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    # 全量归档预留（默认路由不使用）
    full: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    # 回流次级库（可为空）
    secondary: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
